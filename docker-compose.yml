services:
  redis-node-0:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7000"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
    ports:
      - "7000:7000"
    volumes:
      - redis-node-0:/data

  redis-node-1:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7001"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
    ports:
      - "7001:7001"
    volumes:
      - redis-node-1:/data

  redis-node-2:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7002"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
    ports:
      - "7002:7002"
    volumes:
      - redis-node-2:/data

  redis-cluster-init:
    image: redis:7.4-alpine
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
    entrypoint:
      - sh
      - -c
      - |
        sleep 3
        redis-cli --cluster create redis-node-0:7000 redis-node-1:7001 redis-node-2:7002 --cluster-replicas 0 --cluster-yes || true
    restart: "no"

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-init:
    image: bitnami/kafka:3.8
    depends_on:
      - kafka
    entrypoint:
      - sh
      - -c
      - |
        sleep 8
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic api-usage-events --partitions 12 --replication-factor 1
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  redis-node-0:
  redis-node-1:
  redis-node-2:
  kafka-data:
