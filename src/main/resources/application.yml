spring:
  application:
    name: throttlr
  threads:
    virtual:
      enabled: true
  data:
    redis:
      cluster:
        nodes:
          - localhost:7000
          - localhost:7001
          - localhost:7002
      timeout: 250ms
      lettuce:
        pool:
          enabled: true
          max-active: 128
          max-idle: 64
          min-idle: 8
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      compression-type: zstd
      properties:
        linger.ms: 5
        delivery.timeout.ms: 45000
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  tomcat:
    threads:
      max: 32
      min-spare: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        redis.rate.limit.latency: true
        http.server.requests: true
      percentiles:
        redis.rate.limit.latency: 0.95,0.99

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      redisRateLimiter:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5

rate-limiter:
  kafka:
    usage-topic: api-usage-events
  fallback:
    default-mode: FAIL_OPEN
  global-policy:
    id: global-default
    scope: GLOBAL
    algorithm: TOKEN_BUCKET
    hard-limit: 1000
    soft-limit: 900
    refill-rate-per-second: 100
    burst-capacity: 1000
    window: 60s
    cost: 1
  policies:
    - id: plan-free-default
      scope: PLAN
      tenant-id: demo
      plan-id: free
      algorithm: SLIDING_WINDOW_COUNTER
      hard-limit: 100
      soft-limit: 80
      window: 60s
      cost: 1
      fallback-mode: FAIL_OPEN
    - id: org-demo-burst
      scope: ORGANIZATION
      tenant-id: demo
      organization-id: acme
      algorithm: TOKEN_BUCKET
      hard-limit: 500
      soft-limit: 450
      refill-rate-per-second: 50
      burst-capacity: 500
      window: 60s
      cost: 1
      fallback-mode: FAIL_OPEN
    - id: user-vip-override
      scope: USER
      tenant-id: demo
      user-id: vip-user
      algorithm: LEAKY_BUCKET
      hard-limit: 1000
      soft-limit: 900
      refill-rate-per-second: 100
      burst-capacity: 1000
      window: 60s
      cost: 1
      fallback-mode: FAIL_OPEN
