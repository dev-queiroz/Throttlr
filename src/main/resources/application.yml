spring:
  application:
    name: distributed-rate-limiter
  threads:
    virtual:
      enabled: true
  data:
    redis:
      cluster:
        nodes:
          - localhost:7000
          - localhost:7001
          - localhost:7002
      timeout: 250ms
      lettuce:
        pool:
          enabled: true
          max-active: 128
          max-idle: 64
          min-idle: 8
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      compression-type: zstd
      properties:
        linger.ms: 5
        delivery.timeout.ms: 30000
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  tomcat:
    threads:
      max: 32
      min-spare: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        redis.rate.limit.latency: true
        http.server.requests: true
      percentiles:
        redis.rate.limit.latency: 0.95,0.99

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      redisRateLimiter:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5

rate-limiter:
  kafka:
    usage-topic: api-usage-events
  fallback:
    default-mode: fail-open
  global-policy:
    id: global-default
    algorithm: token_bucket
    hard-limit: 1000
    soft-limit: 900
    refill-rate-per-second: 100
    burst-capacity: 1000
    window-seconds: 60
    cost: 1
